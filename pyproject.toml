[project]
name = "cerebral"
version = "0.1.0"
description = "Cerebral"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cerebral-lib",
    "fastapi[standard]>=0.140.0",
    "greenlet>=3.5.4",
    "psycopg>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
cerebral-lib = { workspace = true }



[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test in tests/ is async against a real database; opting each one in
# with a marker would be noise.
asyncio_mode = "auto"
# The engine and schema are built once per session, so the fixtures and the
# tests that use them have to share one event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.pyright]
# Target environment settings
pythonVersion = "3.13"
pythonPlatform = "Linux"

# Files and directories to process or ignore
include = ["src", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "build"
]
ignore = ["src/legacy_code/*.py"]

# Basic configuration
typeCheckingMode = "basic" # Options: "off", "basic", "standard", "strict"
useLibraryCodeForTypes = true

# Strictness overrides and rule tweaks
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "error"
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportMissingImports = "error"

# Path to the virtual environment (helps resolve third-party packages)
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
