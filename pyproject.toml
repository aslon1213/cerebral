[project]
name = "cerebral"
version = "0.1.0"
description = "Cerebral"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cerebral-lib",
    "fastapi[standard]>=0.140.0",
    "greenlet>=3.5.4",
    "psycopg>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
cerebral-lib = { workspace = true }
